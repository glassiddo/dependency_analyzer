# r_dep_analyzer config (YAML)
version: 2
scan:
  r_extensions: [.R, .r, .Rmd, .RMD]
  data_extensions: [.csv, .CSV, .rds, .RDS, .rda, .RData, .xlsx, .xls, .dta]
  exclude_dirs: [_dependency_analysis, .git, .Rproj.user, renv, .Rhistory]
data:
  sample_rows: 5
  stata_read_contents: false
output:
  dir_name: _dependency_analysis
  master_file: master_summary.md
  viz_file: dependency_graph.html
setup_files: []
master_files: []
exclude_dirs: [Archive, archive, archives, old, Old, backup, Backup]
include_dirs: []
roots: []
graph:
  roots: []
  show_archived: false
  show_low_confidence_edges: true
  show_meta: false
  show_independent: false
  exclude: []
  meta_patterns: [setup.py, pyproject.toml, requirements*.txt, Pipfile, poetry.lock, package.json, package-lock.json, pnpm-lock.yaml, yarn.lock, tsconfig*.json, webpack*.js, vite.config.*, rollup.config.*, Makefile, CMakeLists.txt, Dockerfile, .github/workflows/*.yml, .github/workflows/*.yaml, *[Mm]aster*.R, *[Ss]etup*.R, *[Cc]onfig*.R, *[Ii]nit*.R, *_Master.do, *master*.do, *setup*.do]
